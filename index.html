<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mascot & Developer Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --text: #f8fafc;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #475569;
            padding-bottom: 10px;
        }

        .nav-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .nav-btn:hover { background: #64748b; }

        #secretDevBtn {
            display: none;
            background: var(--warning);
            color: #000;
            font-weight: bold;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.7; transform: scale(1); }
            to { opacity: 1; transform: scale(1.05); }
        }

        .page { display: none; }
        .page.active { display: flex; flex-direction: column; gap: 20px; }

        .mascot-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 20px;
            border-radius: 12px;
            background: #334155;
        }

        .mascot-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            background: #1e293b;
        }

        .speech-bubble {
            margin-top: 15px;
            background: #475569;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            text-align: center;
            max-width: 90%;
            min-height: 24px;
        }

        .joy-anim { animation: bounce 0.5s infinite alternate; }
        .confused-anim { transform: rotate(-5deg); }
        .angry-anim-1 { border-color: #f97316; }
        .angry-anim-2 { border-color: #ef4444; animation: shake 0.3s infinite; }
        .angry-anim-3 { border-color: #991b1b; animation: shake 0.1s infinite; transform: scale(1.05); }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }

        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: var(--text);
            font-size: 14px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        button {
            background: var(--primary);
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }

        .section {
            border-top: 1px solid #475569;
            padding-top: 12px;
        }

        .history-list {
            max-height: 120px;
            overflow-y: auto;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
        }

        .dev-section-box {
            background: #111827;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            margin-bottom: 12px;
        }

        .dev-section-box h4 {
            margin-top: 0;
            color: #60a5fa;
            border-bottom: 1px solid #374151;
            padding-bottom: 5px;
        }

        .filtered-item {
            background: #1f2937;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 12px;
            border-left: 3px solid var(--primary);
        }

        .kb-item-card {
            background: #1f2937;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #banMessage {
            color: var(--danger);
            font-weight: bold;
            text-align: center;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h3 id="appTitle">🤖 AI User Space</h3>
        <div>
            <button id="secretDevBtn" class="nav-btn" onclick="openDevAuth()">⚙️ Панель разработчика</button>
            <button id="navToggleBtn" class="nav-btn" onclick="switchPage('dev')">Вход для разработчика</button>
        </div>
    </div>

    <!-- ПОЛЬЗОВАТЕЛЬСКАЯ СТРАНИЦА -->
    <div id="userPage" class="page active">
        <div class="mascot-box">
            <img id="mascotImg" src="" alt="Mascot" class="mascot-avatar" onerror="this.src='https://via.placeholder.com/110?text=AI'">
            <div class="speech-bubble" id="speechBubble">Привет! Задай мне вопрос или отправь идею. (Секрет: когда триумф восхода луны)</div>
        </div>

        <div class="section">
            <label><b>Задать вопрос ИИ:</b></label>
            <input type="text" id="userInput" placeholder="Напишите ваш вопрос...">
            <button id="askBtn" onclick="askAI()">Спросить</button>
            <div id="banMessage"></div>
        </div>

        <div class="section">
            <label><b>Отправить идею, проблему или вопрос разработчику:</b></label>
            <select id="feedbackType">
                <option value="идея">💡 Идея</option>
                <option value="проблема">⚠️ Проблема / Баг</option>
                <option value="вопрос">❓ Вопрос разработчику</option>
            </select>
            <textarea id="userFeedback" placeholder="Опишите вашу идею или проблему подробно..." style="margin-top: 5px;"></textarea>
            <button onclick="sendUserFeedback()" style="background: var(--accent); margin-top: 5px;">Отправить разработчику</button>
        </div>

        <div class="section">
            <label><b>История поиска:</b></label>
            <div class="history-list" id="historyList"></div>
            <button onclick="clearHistory()" style="background: #64748b; font-size: 11px; padding: 4px; margin-top: 5px;">Очистить историю</button>
        </div>
    </div>

    <!-- СТРАНИЦА РАЗРАБОТЧИКА -->
    <div id="devPage" class="page">
        <h3>🔐 Защищенная Панель Разработчика</h3>
        <div id="devAuthBox">
            <p style="font-size: 13px; color: #94a3b8;">Введите пароль разработчика (по умолчанию: <code>dev2026</code>):</p>
            <input type="password" id="devPasswordInput" placeholder="Пароль...">
            <button onclick="checkDevPassword()" style="margin-top: 8px;">Войти</button>
            <button onclick="switchPage('user')" style="background: #64748b; margin-top: 5px;">Назад к пользователю</button>
        </div>

        <div id="devContentBox" style="display: none;">
            <button onclick="switchPage('user')" style="background: #64748b; margin-bottom: 15px; font-size: 12px;">⬅️ Вернуться на пользовательскую страницу</button>

            <!-- НАСТРОЙКА ИМЕНИ МАСКОТА -->
            <div class="dev-section-box">
                <h4>🏷️ Имя маскота</h4>
                <input type="text" id="mascotRealName" placeholder="Например: лучик">
                <button onclick="updateMascotName()" style="margin-top: 8px;">Сохранить имя</button>
            </div>

            <!-- СТРОКА 1: Архив знаний -->
            <div class="dev-section-box">
                <h4>📁 1. Архив знаний</h4>
                <input type="text" id="kbCategory" placeholder="Категория">
                <input type="text" id="kbSubcategory" placeholder="Подкатегория">
                <input type="text" id="kbKeyword" placeholder="Ключевое слово / Вопрос">
                <textarea id="kbAnswer" placeholder="Ответ ИИ..." style="margin-top: 5px;"></textarea>
                <button onclick="addNewKnowledge()" style="margin-top: 8px;">Сохранить / Обновить</button>
                <div style="margin-top: 15px;">
                    <div id="kbListContainer" style="max-height: 150px; overflow-y: auto;"></div>
                </div>
            </div>

            <!-- СТРОКА 2: Управление маскотом, репликами и ИЗОБРАЖЕНИЯМИ -->
            <div class="dev-section-box">
                <h4>🎨 2. Настройка маскота (Реплики и Картинки)</h4>
                <select id="mascotEmotionSelect" onchange="loadEmotionDataForEdit()">
                    <option value="neutral">Нейтральный</option>
                    <option value="joy">Радость</option>
                    <option value="confused">Недопонимание</option>
                    <option value="angry-1">Злость Уровень 1</option>
                    <option value="angry-2">Злость Уровень 2</option>
                    <option value="angry-3">Злость Уровень 3 (Бан)</option>
                </select>
                <input type="text" id="mascotCustomText" placeholder="Текст реплики для выбранного настроения" style="margin-top: 5px;">
                <input type="text" id="mascotCustomImg" placeholder="Ссылка или путь к картинке (.png / .jpg)" style="margin-top: 5px;">
                <button onclick="updateMascotConfig()" style="margin-top: 8px;">Сохранить настройки настроения</button>
            </div>

            <!-- СТРОКА 3: Аналитика -->
            <div class="dev-section-box">
                <h4>📊 3. Аналитика отзывов</h4>
                <button onclick="renderAnalytics()" style="background: #2563eb; font-size: 12px; padding: 6px;">🔄 Обновить</button>
                <div id="analyticsContainer" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let knowledgeBase = JSON.parse(localStorage.getItem('ai_kb_v5')) || {
        "привет": { cat: "Общие", sub: "Приветствия", ans: "Привет! Я твой цифровой помощник." },
        "как дела": { cat: "Общие", sub: "Состояние", ans: "Всё отлично, обрабатываю данные!" },
        "когда триумф восхода луны": { cat: "Секрет", sub: "Пасхалка", ans: "Поздравляю! Панель разработчика разблокирована сверху." }
    };

    let mascotName = localStorage.getItem('ai_mascot_name') || "лучик";

    // Хранилище реплик и картинок для каждой эмоции
    let mascotConfig = JSON.parse(localStorage.getItem('ai_mascot_full_config')) || {
        "neutral": { text: "Привет! Задай мне вопрос или отправь идею.", img: "https://via.placeholder.com/110?text=Neutral" },
        "joy": { text: "Ой, спасибо большое! Мне очень приятно слышать такие теплые слова! 🥰", img: "https://via.placeholder.com/110?text=Joy" },
        "confused": { text: "Я не понимаю этот вопрос или ты не назвал меня по моему имени...", img: "https://via.placeholder.com/110?text=Confused" },
        "angry-1": { text: "Эй, полегче на поворотах! Зачем обзываться или материться? Уровень злости: 1/3.", img: "https://via.placeholder.com/110?text=Angry1" },
        "angry-2": { text: "Ты снова за своё?! Прекрати это немедленно! Уровень злости: 2/3.", img: "https://via.placeholder.com/110?text=Angry2" },
        "angry-3": { text: "ВСЁ! Хватит с меня! Ты заблокирован за оскорбления на 30 минут! 😡", img: "https://via.placeholder.com/110?text=Angry3" }
    };

    let history = JSON.parse(localStorage.getItem('ai_history_v5')) || [];
    let userFeedbackList = JSON.parse(localStorage.getItem('ai_feedback_v5')) || [];
    let badQueryCount = parseInt(localStorage.getItem('ai_bad_count_v5')) || 0;
    let banUntil = parseInt(localStorage.getItem('ai_ban_until_v5')) || 0;

    document.getElementById('mascotRealName').value = mascotName;
    checkBanStatus();
    updateHistoryUI();
    setEmotion('neutral'); // Установка стартовой эмоции и картинки
    loadEmotionDataForEdit();

    function switchPage(pageName) {
        document.getElementById('userPage').classList.remove('active');
        document.getElementById('devPage').classList.remove('active');
        
        if (pageName === 'user') {
            document.getElementById('userPage').classList.add('active');
            document.getElementById('appTitle').innerText = "🤖 AI User Space";
            checkBanStatus();
        } else if (pageName === 'dev') {
            document.getElementById('devPage').classList.add('active');
            document.getElementById('appTitle').innerText = "⚙️ Dev Hub";
            renderKbList();
            loadEmotionDataForEdit();
        }
    }

    function openDevAuth() { switchPage('dev'); }

    function checkDevPassword() {
        const pass = document.getElementById('devPasswordInput').value;
        if (pass === "dev2026") {
            document.getElementById('devAuthBox').style.display = 'none';
            document.getElementById('devContentBox').style.display = 'block';
            renderAnalytics();
            renderKbList();
        } else {
            alert('Неверный пароль разработчика!');
        }
    }

    function checkBanStatus() {
        let now = new Date().getTime();
        let inputField = document.getElementById('userInput');
        let askBtn = document.getElementById('askBtn');
        let banMsg = document.getElementById('banMessage');

        if (now < banUntil) {
            let minutesLeft = Math.ceil((banUntil - now) / 60000);
            inputField.disabled = true;
            askBtn.disabled = true;
            banMsg.style.display = 'block';
            banMsg.innerText = `⚠️ Вы заблокированы за оскорбления/мат. Осталось минут: ${minutesLeft}`;
            setTimeout(checkBanStatus, 1000);
        } else {
            inputField.disabled = false;
            askBtn.disabled = false;
            banMsg.style.display = 'none';
            if (banUntil !== 0 && now >= banUntil) {
                badQueryCount = 0;
                banUntil = 0;
                localStorage.setItem('ai_bad_count_v5', 0);
                localStorage.setItem('ai_ban_until_v5', 0);
            }
        }
    }

    function setEmotion(state) {
        const img = document.getElementById('mascotImg');
        const bubble = document.getElementById('speechBubble');
        
        let configItem = mascotConfig[state] || mascotConfig["neutral"];
        bubble.innerText = configItem.text;
        img.src = configItem.img;
        
        speakText(configItem.text);

        img.className = "mascot-avatar";
        if (state === 'neutral') img.classList.add('neutral');
        else if (state === 'joy') img.classList.add('joy-anim');
        else if (state === 'confused') img.classList.add('confused-anim');
        else if (state === 'angry-1') img.classList.add('angry-anim-1');
        else if (state === 'angry-2') img.classList.add('angry-anim-2');
        else if (state === 'angry-3') img.classList.add('angry-anim-3');
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            window.speechSynthesis.speak(utterance);
        }
    }

    function askAI() {
        if (new Date().getTime() < banUntil) return;

        const input = document.getElementById('userInput');
        const query = input.value.trim().toLowerCase();
        if (!query) return;

        if (query.includes("когда триумф восхода луны")) {
            document.getElementById('secretDevBtn').style.display = 'inline-block';
        }

        const badWords = ["дурак", "тупой", "идиот", "ненавижу", "мразь", "сука", "блять", "черт", "тупица", "урод", "дебил", "фигня", "задолбал"];
        const compliments = ["спасибо", "пожалуйста", "лучший", "умничка", "потрясающий", "крутой", "прекрасный", "милый", "великолепно", "отлично"];

        let hasBadWord = badWords.some(word => query.includes(word));
        let hasCompliment = compliments.some(word => query.includes(word));
        let mentionsName = query.includes(mascotName.toLowerCase());

        if (hasBadWord) {
            badQueryCount++;
            localStorage.setItem('ai_bad_count_v5', badQueryCount);

            if (badQueryCount === 1) {
                setEmotion('angry-1');
            } else if (badQueryCount >= 2 && badQueryCount < 5) {
                setEmotion('angry-2');
            } else if (badQueryCount >= 5) {
                banUntil = new Date().getTime() + (30 * 60 * 1000);
                localStorage.setItem('ai_ban_until_v5', banUntil);
                setEmotion('angry-3');
                checkBanStatus();
            }
        } else if (hasCompliment) {
            setEmotion('joy');
        } else if (!mentionsName) {
            // Если забыл имя, временно подставим текст недопонимания, но оставим картинку confused
            const img = document.getElementById('mascotImg');
            const bubble = document.getElementById('speechBubble');
            let confText = `Эй, а где же мое имя (${mascotName}) в твоем вопросе?`;
            bubble.innerText = confText;
            img.src = mascotConfig['confused'].img;
            img.className = "mascot-avatar confused-anim";
            speakText(confText);
        } else {
            let foundKey = Object.keys(knowledgeBase).find(key => query.includes(key));
            if (foundKey) {
                const img = document.getElementById('mascotImg');
                const bubble = document.getElementById('speechBubble');
                let ansText = knowledgeBase[foundKey].ans;
                bubble.innerText = ansText;
                img.src = mascotConfig['neutral'].img;
                img.className = "mascot-avatar neutral";
                speakText(ansText);
            } else {
                setEmotion('confused');
            }
        }

        history.unshift(`Вопрос: ${input.value}`);
        if (history.length > 20) history.pop();
        localStorage.setItem('ai_history_v5', JSON.stringify(history));
        updateHistoryUI();
        input.value = "";
    }

    function sendUserFeedback() {
        const type = document.getElementById('feedbackType').value;
        const text = document.getElementById('userFeedback').value.trim();
        if (!text) return;

        let priority = type === 'проблема' ? 'высокий' : 'низкий';
        userFeedbackList.push({ type, text, priority, time: new Date().toLocaleTimeString() });
        localStorage.setItem('ai_feedback_v5', JSON.stringify(userFeedbackList));
        setEmotion('joy');
        document.getElementById('userFeedback').value = "";
    }

    function updateHistoryUI() {
        const list = document.getElementById('historyList');
        list.innerHTML = history.map(item => `<div>• ${item}</div>`).join('');
    }

    function clearHistory() {
        history = [];
        localStorage.removeItem('ai_history_v5');
        updateHistoryUI();
    }

    function updateMascotName() {
        let newName = document.getElementById('mascotRealName').value.trim();
        if (newName) {
            mascotName = newName;
            localStorage.setItem('ai_mascot_name', mascotName);
            alert(`Имя маскота успешно изменено на: ${mascotName}`);
        }
    }

    function addNewKnowledge() {
        const cat = document.getElementById('kbCategory').value.trim();
        const sub = document.getElementById('kbSubcategory').value.trim();
        const keyword = document.getElementById('kbKeyword').value.trim().toLowerCase();
        const ans = document.getElementById('kbAnswer').value.trim();

        if (!cat || !keyword || !ans) return;

        knowledgeBase[keyword] = { cat, sub, ans };
        localStorage.setItem('ai_kb_v5', JSON.stringify(knowledgeBase));
        alert('Сохранено в архив!');
        renderKbList();
    }

    function renderKbList() {
        const container = document.getElementById('kbListContainer');
        let keys = Object.keys(knowledgeBase);
        let html = "";
        keys.forEach(key => {
            let item = knowledgeBase[key];
            html += `<div class="kb-item-card"><div><b>[${item.cat}]</b> ${key}</div></div>`;
        });
        container.innerHTML = html;
    }

    // Загрузка текущих данных выбранного настроения в поля ввода панели разработчика
    function loadEmotionDataForEdit() {
        const emotion = document.getElementById('mascotEmotionSelect').value;
        if (mascotConfig[emotion]) {
            document.getElementById('mascotCustomText').value = mascotConfig[emotion].text;
            document.getElementById('mascotCustomImg').value = mascotConfig[emotion].img;
        }
    }

    // Сохранение реплики и картинки для выбранного настроения
    function updateMascotConfig() {
        const emotion = document.getElementById('mascotEmotionSelect').value;
        const customText = document.getElementById('mascotCustomText').value.trim();
        const customImg = document.getElementById('mascotCustomImg').value.trim();
        
        if (customText && customImg) {
            mascotConfig[emotion] = { text: customText, img: customImg };
            localStorage.setItem('ai_mascot_full_config', JSON.stringify(mascotConfig));
            alert('Настройки маскота (текст и картинка) успешно обновлены!');
            setEmotion(emotion); // Сразу показываем обновленный вид
        } else {
            alert('Заполните оба поля (текст и путь к картинке)!');
        }
    }

    function renderAnalytics() {
        const container = document.getElementById('analyticsContainer');
        if (userFeedbackList.length === 0) {
            container.innerHTML = `<div style="font-size:12px; color:#94a3b8;">Нет отзывов.</div>`;
            return;
        }
        let html = "";
        userFeedbackList.forEach(i => {
            html += `<div class="filtered-item">[${i.type.toUpperCase()}] ${i.text}</div>`;
        });
        container.innerHTML = html;
    }
</script>

</body>
</html>
