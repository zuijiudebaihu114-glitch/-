
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mascot & Developer Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --text: #f8fafc;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #475569;
            padding-bottom: 10px;
        }

        .nav-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .nav-btn:hover { background: #64748b; }

        #secretDevBtn {
            display: none;
            background: var(--warning);
            color: #000;
            font-weight: bold;
        }

        .page { display: none; }
        .page.active { display: flex; flex-direction: column; gap: 20px; }

        .mascot-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border-radius: 12px;
            background: #334155;
        }

        .mascot-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            background: #1e293b;
        }

        .speech-bubble {
            margin-top: 15px;
            background: #475569;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            text-align: center;
            max-width: 90%;
        }

        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: var(--text);
            font-size: 14px;
            box-sizing: border-box;
            margin-top: 6px;
        }

        button {
            background: var(--primary);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2563eb; }

        .section {
            border-top: 1px solid #475569;
            padding-top: 12px;
        }

        .history-list {
            max-height: 120px;
            overflow-y: auto;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 6px;
        }

        .dev-section-box {
            background: #111827;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            margin-bottom: 12px;
        }

        .dev-section-box h4 {
            margin-top: 0;
            color: #60a5fa;
            border-bottom: 1px solid #374151;
            padding-bottom: 5px;
        }

        .kb-item-card {
            background: #1f2937;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .del-btn {
            background: var(--danger);
            width: auto;
            padding: 4px 8px;
            font-size: 12px;
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h3 id="appTitle" style="margin:0;">🤖 AI User Space</h3>
        <div style="display: flex; gap: 6px;">
            <button id="secretDevBtn" class="nav-btn">⚙️ Админка</button>
            <button id="navToggleBtn" class="nav-btn">Вход для разработчика</button>
        </div>
    </div>

    <!-- ПОЛЬЗОВАТЕЛЬСКАЯ СТРАНИЦА -->
    <div id="userPage" class="page active">
        <div class="mascot-box">
            <img id="mascotImg" src="https://via.placeholder.com/110?text=AI" alt="Mascot" class="mascot-avatar">
            <div class="speech-bubble" id="speechBubble">Привет! Задай мне вопрос или отправь идею.</div>
        </div>

        <div class="section">
            <label><b>Задать вопрос ИИ:</b></label>
            <input type="text" id="userInput" placeholder="Напишите ваш вопрос...">
            <button id="askBtn">Спросить</button>
        </div>

        <div class="section">
            <label><b>Отправить отзыв / идею разработчику:</b></label>
            <select id="feedbackType">
                <option value="идея">💡 Идея</option>
                <option value="проблема">⚠️ Проблема / Баг</option>
                <option value="вопрос">❓ Вопрос</option>
            </select>
            <textarea id="userFeedback" placeholder="Опишите подробно..." rows="2"></textarea>
            <button id="sendFeedbackBtn" style="background: var(--accent);">Отправить</button>
        </div>

        <div class="section">
            <label><b>История запросов:</b></label>
            <div class="history-list" id="historyList"></div>
            <button id="clearHistoryBtn" style="background: #64748b; font-size: 11px; padding: 6px;">Очистить историю</button>
        </div>
    </div>

    <!-- СТРАНИЦА РАЗРАБОТЧИКА -->
    <div id="devPage" class="page">
        <h3 style="margin:0;">🔐 Панель Разработчика</h3>
        
        <div id="devAuthBox">
            <p style="font-size: 13px; color: #94a3b8;">Введите пароль (по умолчанию: <code>dev2026</code>):</p>
            <input type="password" id="devPasswordInput" placeholder="Пароль...">
            <button id="loginDevBtn" style="margin-top: 8px;">Войти</button>
            <button id="backToUserFromAuth" style="background: #64748b; margin-top: 6px;">Назад</button>
        </div>

        <div id="devContentBox" style="display: none;">
            <button id="backToUserBtn" style="background: #64748b; margin-bottom: 12px; font-size: 12px;">⬅️ На главную</button>

            <!-- Имя маскота -->
            <div class="dev-section-box">
                <h4>🏷️ Имя маскота</h4>
                <input type="text" id="mascotRealName" placeholder="Имя маскота">
                <button id="saveNameBtn" style="margin-top: 6px;">Сохранить имя</button>
            </div>

            <!-- Архив знаний -->
            <div class="dev-section-box">
                <h4>📁 Архив знаний</h4>
                <input type="text" id="kbCategory" placeholder="Категория">
                <input type="text" id="kbKeyword" placeholder="Ключевое слово для поиска">
                <textarea id="kbAnswer" placeholder="Ответ ИИ..." rows="2"></textarea>
                <button id="saveKbBtn" style="margin-top: 6px;">Добавить / Изменить</button>
                <div id="kbListContainer" style="margin-top: 10px; max-height: 150px; overflow-y: auto;"></div>
            </div>

            <!-- Аналитика -->
            <div class="dev-section-box">
                <h4>📊 Аналитика отзывов</h4>
                <button id="clearAnalyticsBtn" style="background: #64748b; font-size: 12px; padding: 6px;">Очистить отзывы</button>
                <div id="analyticsContainer" style="margin-top: 10px; max-height: 150px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Базовые данные
    let knowledgeBase = JSON.parse(localStorage.getItem('kb_data')) || {
        "привет": { cat: "Общие", ans: "Привет! Рад тебя видеть." },
        "как дела": { cat: "Общие", ans: "Всё отлично! Готов к работе." },
        "когда триумф восхода луны": { cat: "Секрет", ans: "Секретная кнопка разработчика разблокирована сверху!" }
    };

    let mascotName = localStorage.getItem('mascot_name') || "лучик";
    let historyList = JSON.parse(localStorage.getItem('history_data')) || [];
    let feedbackList = JSON.parse(localStorage.getItem('feedback_data')) || [];

    // Элементы
    const userPage = document.getElementById('userPage');
    const devPage = document.getElementById('devPage');
    const appTitle = document.getElementById('appTitle');
    const speechBubble = document.getElementById('speechBubble');
    const userInput = document.getElementById('userInput');
    const historyContainer = document.getElementById('historyList');

    // Переключение страниц
    function showPage(page) {
        userPage.classList.remove('active');
        devPage.classList.remove('active');
        if (page === 'user') {
            userPage.classList.add('active');
            appTitle.innerText = "🤖 AI User Space";
        } else {
            devPage.classList.add('active');
            appTitle.innerText = "⚙️ Dev Hub";
            renderKbList();
            renderAnalytics();
        }
    }

    // Обработка вопросов ИИ
    function handleAsk() {
        let text = userInput.value.trim().toLowerCase();
        if (!text) return;

        // Пасхалка для открытия админки
        if (text.includes("когда триумф восхода луны")) {
            document.getElementById('secretDevBtn').style.display = 'inline-block';
            speechBubble.innerText = knowledgeBase["когда триумф восхода луны"].ans;
        } else {
            let foundKey = Object.keys(knowledgeBase).find(key => text.includes(key));
            if (foundKey) {
                speechBubble.innerText = knowledgeBase[foundKey].ans;
            } else {
                speechBubble.innerText = "Я пока не знаю ответ на этот вопрос, но записал его!";
            }
        }

        historyList.unshift(userInput.value);
        if (historyList.length > 15) historyList.pop();
        localStorage.setItem('history_data', JSON.stringify(historyList));
        updateHistoryUI();
        userInput.value = "";
    }

    function updateHistoryUI() {
        historyContainer.innerHTML = historyList.map(item => `<div>• ${item}</div>`).join('') || '<div style="color:#64748b">Пусто</div>';
    }

    // Управление базой знаний в админке
    function renderKbList() {
        let container = document.getElementById('kbListContainer');
        container.innerHTML = Object.keys(knowledgeBase).map(key => `
            <div class="kb-item-card">
                <div><b>[${knowledgeBase[key].cat}]</b> ${key}</div>
                <button class="del-btn" onclick="deleteKb('${key}')">Удалить</button>
            </div>
        `).join('');
    }

    window.deleteKb = function(key) {
        delete knowledgeBase[key];
        localStorage.setItem('kb_data', JSON.stringify(knowledgeBase));
        renderKbList();
    };

    function renderAnalytics() {
        let container = document.getElementById('analyticsContainer');
        container.innerHTML = feedbackList.map(f => `<div style="background:#1f2937; padding:6px; margin-top:4px; border-radius:4px; font-size:12px;"><b>[${f.type}]</b> ${f.text}</div>`).join('') || '<div style="color:#64748b; font-size:12px;">Нет отзывов</div>';
    }

    // Привязка кнопок через безопасный JS (гарантирует работу)
    document.getElementById('askBtn').addEventListener('click', handleAsk);
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAsk(); });

    document.getElementById('navToggleBtn').addEventListener('click', () => showPage('dev'));
    document.getElementById('secretDevBtn').addEventListener('click', () => showPage('dev'));
    document.getElementById('backToUserBtn').addEventListener('click', () => showPage('user'));
    document.getElementById('backToUserFromAuth').addEventListener('click', () => showPage('user'));

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
        historyList = [];
        localStorage.removeItem('history_data');
        updateHistoryUI();
    });

    document.getElementById('sendFeedbackBtn').addEventListener('click', () => {
        let type = document.getElementById('feedbackType').value;
        let text = document.getElementById('userFeedback').value.trim();
        if (!text) return alert('Введите текст отзыва!');
        feedbackList.unshift({ type, text });
        localStorage.setItem('feedback_data', JSON.stringify(feedbackList));
        document.getElementById('userFeedback').value = "";
        alert('Спасибо! Отзыв отправлен разработчику.');
    });

    document.getElementById('loginDevBtn').addEventListener('click', () => {
        let pass = document.getElementById('devPasswordInput').value;
        if (pass === "dev2026") {
            document.getElementById('devAuthBox').style.display = 'none';
            document.getElementById('devContentBox').style.display = 'block';
            document.getElementById('devPasswordInput').value = "";
        } else {
            alert('Неверный пароль!');
        }
    });

    document.getElementById('saveNameBtn').addEventListener('click', () => {
        let name = document.getElementById('mascotRealName').value.trim();
        if (name) {
            mascotName = name;
            localStorage.setItem('mascot_name', mascotName);
            alert('Имя сохранено!');
        }
    });

    document.getElementById('saveKbBtn').addEventListener('click', () => {
        let cat = document.getElementById('kbCategory').value.trim();
        let key = document.getElementById('kbKeyword').value.trim().toLowerCase();
        let ans = document.getElementById('kbAnswer').value.trim();
        if (!cat || !key || !ans) return alert('Заполните все поля!');
        knowledgeBase[key] = { cat, ans };
        localStorage.setItem('kb_data', JSON.stringify(knowledgeBase));
        renderKbList();
        alert('Запись добавлена!');
        document.getElementById('kbCategory').value = "";
        document.getElementById('kbKeyword').value = "";
        document.getElementById('kbAnswer').value = "";
    });

    document.getElementById('clearAnalyticsBtn').addEventListener('click', () => {
        feedbackList = [];
        localStorage.removeItem('feedback_data');
        renderAnalytics();
    });

    // Инициализация при старте
    document.getElementById('mascotRealName').value = mascotName;
    updateHistoryUI();
</script>

</body>
</html>
